<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Olimpia Weekly MACD</title>
</head>

<body>

    <h1>OLIMPIA WEEKLY MACD</h1>

    <p>Scanner MACD settimanale • MEXC Spot USDT</p>

    <div id="signals">
        Caricamento segnali...
    </div>

    <script>
        fetch("signals.json")
            .then(response => response.json())
            .then(data => {

                const container = document.getElementById("signals");

                if (data.length === 0) {
                    container.innerHTML = "Nessun segnale.";
                    return;
                }

                container.innerHTML = data.map(coin => `
                    <p>
                        <strong>${coin.symbol}</strong>
                        | MACD: ${coin.macd}
                        | PRICE: ${coin.price}
                    </p>
                `).join("");

            })
            .catch(error => {
                document.getElementById("signals").innerHTML =
                    "Errore nel caricamento dei segnali.";
            });
    </script>

</body>
</html>
